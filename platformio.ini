; E-Ink Smart Home Remote
; Hardware: LILYGO T5 E-Paper S3 Pro Lite (ESP32-S3, 4.7" 960x540 e-paper)

[platformio]
default_envs = t5_epaper_s3_lite
boards_dir = boards
src_dir = src

[env]
platform = espressif32@6.12.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
  default
  time
  esp32_exception_decoder
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  bitbank2/FastEPD@^2.1.0
  lewisxhe/SensorLib@^0.2.2
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DPSRAM_SPEED=120MHz

[env:t5_epaper_s3_lite]
extends = env
board = T5-ePaper-S3
build_flags =
  ${env.build_flags}
  -DLILYGO_T5_EPD47_S3


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lily Remote — Home Prototype</title>
  <style>
    :root {
      --ink: #10110f;
      --paper: #e7e8dc;
      --paper-deep: #d8dacb;
      --w: 540px;
      --h: 960px;
      --mono: "Courier Prime", "IBM Plex Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #333 0 1px, transparent 1.5px),
        linear-gradient(135deg, #191919, #050505);
      background-size: 18px 18px, auto;
      color: var(--ink);
      font-family: var(--mono);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      width: var(--w);
      height: var(--h);
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(16,17,15,.025) 0 1px, transparent 1px 9px),
        linear-gradient(0deg, rgba(16,17,15,.018) 0 1px, transparent 1px 9px),
        var(--paper);
      border: 18px solid var(--ink);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(0,0,0,.26) .6px, transparent .8px);
      background-size: 4px 4px;
      opacity: .08;
      mix-blend-mode: multiply;
    }

    .frame {
      position: absolute;
      inset: 0;
      border: 1px solid var(--ink);
      padding: 0 24px;
    }

    .topbar {
      height: 112px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      border-bottom: 3px solid var(--ink);
      position: relative;
    }

    .page-title {
      margin: 0;
      font-size: 44px;
      line-height: .9;
      letter-spacing: .015em;
    }

    .pill, .media-off {
      height: 38px;
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 0 10px;
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .media-off {
      grid-auto-flow: column;
      gap: 6px;
      background: var(--ink);
      color: var(--paper);
    }

    .media-off .icon { width: 18px; height: 18px; }

    .activities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
      padding-top: 22px;
    }

    .card {
      height: 126px;
      border: 3px solid var(--ink);
      position: relative;
      background: var(--paper);
      padding: 18px 16px 14px 22px;
      overflow: hidden;
      text-align: left;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 12px;
      height: 100%;
      background: var(--ink);
    }

    .card:active,
    .nav button:active,
    .media-off:active { filter: invert(1); }

    .card h2 {
      position: absolute;
      left: 24px;
      bottom: 18px;
      margin: 0;
      font-size: 24px;
      line-height: .95;
      letter-spacing: .005em;
      max-width: 140px;
    }

    .activity-icon {
      position: absolute;
      left: 24px;
      top: 18px;
      width: 50px;
      height: 50px;
    }

    .current-badge {
      position: absolute;
      right: 16px;
      top: 20px;
      width: 28px;
      height: 28px;
      color: var(--ink);
      display: grid;
      place-items: center;
    }

    .current-badge .icon {
      width: 28px;
      height: 28px;
    }

    .quick-controls {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 198px;
      height: 76px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.24fr 1fr 1fr;
      border: 2px solid var(--ink);
      background: var(--paper);
    }

    .quick-controls button {
      border: 0;
      border-right: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
    }

    .quick-controls button:last-child { border-right: 0; }

    .quick-controls button.primary {
      background: var(--ink);
      color: var(--paper);
    }

    .quick-controls .icon {
      width: 32px;
      height: 32px;
    }

    .quick-controls .primary .icon {
      width: 38px;
      height: 38px;
    }

    .quick-controls button:active {
      filter: invert(1);
    }

    .quick-status {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 128px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .chip {
      border: 2px solid var(--ink);
      min-height: 50px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.05;
      background: rgba(255,255,255,.12);
    }

    .footer {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 0;
      height: 112px;
      border-top: 2px solid var(--ink);
      padding-top: 16px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      border: 2px solid var(--ink);
      height: 58px;
    }

    .nav button {
      border: 0;
      border-right: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-rows: 25px 1fr;
      place-items: center;
      padding: 5px 0 4px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .nav button:last-child { border-right: 0; }

    .nav button.active {
      background: var(--ink);
      color: var(--paper);
    }

    .nav .icon { width: 22px; height: 22px; }

    .icon {
      display: block;
      fill: currentColor;
      pointer-events: none;
    }
  </style>
</head>

  <main class="screen" aria-label="Lily Remote Home page prototype">
    <section class="frame">
      <header class="topbar">
        <h1 class="page-title">Home</h1>
        <div class="pill">Online</div>
        <button class="media-off" type="button" aria-label="Turn off media">
          <svg class="icon"><use href="#mdi-power"></use></svg>
          <span>Off</span>
        </button>
      </header>

      <section class="activities" aria-label="Activities">
        <button class="card current" type="button">
          <svg class="icon activity-icon"><use href="#mdi-television-classic"></use></svg>
          <span class="current-badge" aria-label="Current activity"><svg class="icon"><use href="#mdi-radiobox-marked"></use></svg></span>
          <h2>Watch TV</h2>
        </button>
        <button class="card" type="button"><svg class="icon activity-icon"><use href="#mdi-sony-playstation"></use></svg><h2>Play PS5</h2></button>
        <button class="card" type="button"><svg class="icon activity-icon"><use href="#mdi-music"></use></svg><h2>Stream</h2></button>
        <button class="card" type="button"><svg class="icon activity-icon"><use href="#mdi-record-player"></use></svg><h2>Records</h2></button>
      </section>

      <section class="quick-controls" aria-label="Basic media controls">
        <button type="button" aria-label="Volume down"><svg class="icon"><use href="#mdi-volume-minus"></use></svg></button>
        <button type="button" aria-label="Previous"><svg class="icon"><use href="#mdi-skip-previous"></use></svg></button>
        <button class="primary" type="button" aria-label="Play pause"><svg class="icon"><use href="#mdi-play-pause"></use></svg></button>
        <button type="button" aria-label="Next"><svg class="icon"><use href="#mdi-skip-next"></use></svg></button>
        <button type="button" aria-label="Volume up"><svg class="icon"><use href="#mdi-volume-plus"></use></svg></button>
      </section>

      <section class="quick-status" aria-label="Room status">
        <div class="chip">TV<br>Ready</div>
        <div class="chip">WiiM<br>Paused</div>
        <div class="chip">KEF<br>Coax</div>
      </section>

      <footer class="footer">
        <nav class="nav" aria-label="Pages">
          <button class="active" type="button"><svg class="icon"><use href="#mdi-home"></use></svg><span>Home</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-play-circle"></use></svg><span>Media</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-lightbulb-on"></use></svg><span>Lights</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-sofa"></use></svg><span>Room</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-dots-horizontal"></use></svg><span>More</span></button>
        </nav>
      </footer>
    </section>
  </main>

</html>

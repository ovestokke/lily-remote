<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lily Remote — Device Controls Prototype</title>
  <style>
    :root {
      --ink: #10110f;
      --paper: #e7e8dc;
      --paper-deep: #d8dacb;
      --w: 540px;
      --h: 960px;
      --mono: "Courier Prime", "IBM Plex Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #333 0 1px, transparent 1.5px),
        linear-gradient(135deg, #191919, #050505);
      background-size: 18px 18px, auto;
      color: var(--ink);
      font-family: var(--mono);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 0;
    }

    .screen {
      width: var(--w);
      height: var(--h);
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(16,17,15,.025) 0 1px, transparent 1px 9px),
        linear-gradient(0deg, rgba(16,17,15,.018) 0 1px, transparent 1px 9px),
        var(--paper);
      border: 18px solid var(--ink);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(0,0,0,.26) .6px, transparent .8px);
      background-size: 4px 4px;
      opacity: .08;
      mix-blend-mode: multiply;
    }

    .frame {
      position: absolute;
      inset: 0;
      border: 1px solid var(--ink);
      padding: 0 24px;
    }

    .topbar {
      height: 78px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      border-bottom: 2px solid var(--ink);
      position: relative;
    }

    .topbar::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 0;
      width: 14px;
      height: 58px;
      background: var(--ink);
    }

    .brand {
      padding-left: 32px;
      display: grid;
      gap: 4px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .brand span:last-child {
      font-size: 11px;
      letter-spacing: .18em;
    }

    .pill, .off {
      height: 38px;
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 0 10px;
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .off {
      grid-auto-flow: column;
      gap: 6px;
      background: var(--ink);
      color: var(--paper);
    }

    .off .icon { width: 18px; height: 18px; }

    .hero {
      height: 108px;
      display: grid;
      grid-template-columns: 1fr 132px;
      gap: 18px;
      align-items: center;
      border-bottom: 2px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 44px;
      line-height: .9;
      letter-spacing: .015em;
    }

    .target {
      border: 2px solid var(--ink);
      height: 72px;
      background: var(--paper-deep);
      display: grid;
      grid-template-rows: 25px 1fr;
    }

    .target span:first-child {
      display: block;
      background: var(--ink);
      color: var(--paper);
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .target span:last-child {
      display: grid;
      place-items: center;
      padding: 8px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }

    .device-tabs {
      height: 62px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border: 2px solid var(--ink);
      margin-top: 18px;
    }

    .device-tabs button {
      border: 0;
      border-right: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 5px 0;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .device-tabs button:last-child { border-right: 0; }
    .device-tabs button.active { background: var(--ink); color: var(--paper); }
    .device-tabs .icon { width: 23px; height: 23px; }

    .panel {
      display: none;
      position: relative;
      height: 480px;
      margin-top: 18px;
      border: 3px solid var(--ink);
      background: rgba(255,255,255,.08);
      padding: 24px 28px;
    }

    .panel.active { display: block; }

    .panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 12px;
      background: var(--ink);
    }

    .key {
      border: 3px solid var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 13px;
      position: relative;
    }

    .key:active,
    .device-tabs button:active,
    .nav button:active,
    .off:active { filter: invert(1); }

    .key .icon { width: 42px; height: 42px; }
    .key small { font-size: 10px; margin-top: -20px; }

    .key.ok {
      background: var(--ink);
      color: var(--paper);
      border-width: 4px;
      font-size: 23px;
      letter-spacing: .08em;
    }

    .key.ok .ring {
      width: 56px;
      height: 56px;
      border: 4px solid currentColor;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-left: 10px;
    }

    .top-actions .key {
      height: 54px;
      grid-auto-flow: column;
      grid-template-columns: 38px 1fr;
      padding: 0 14px;
      justify-items: start;
      font-size: 14px;
    }

    .top-actions .icon { width: 28px; height: 28px; }

    .dpad {
      margin: 24px auto 0;
      width: 336px;
      height: 336px;
      display: grid;
      grid-template-columns: 112px 112px 112px;
      grid-template-rows: 112px 112px 112px;
    }

    .transport {
      position: absolute;
      left: 38px;
      right: 28px;
      bottom: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .transport .key {
      height: 54px;
      grid-auto-flow: column;
      grid-template-columns: 30px 1fr;
      padding: 0 10px;
      justify-items: start;
      font-size: 12px;
    }

    .transport .icon { width: 24px; height: 24px; }

    .control-grid {
      margin-left: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .control-grid .key {
      height: 112px;
      align-content: center;
      gap: 8px;
      padding: 12px;
      font-size: 16px;
    }

    .control-grid .key .icon { width: 48px; height: 48px; }

    .control-grid .wide {
      grid-column: span 2;
      height: 112px;
      background: var(--ink);
      color: var(--paper);
      grid-auto-flow: column;
      grid-template-columns: 72px 1fr;
      justify-items: start;
      text-align: left;
      padding: 0 26px;
      font-size: 20px;
    }

    .subtle {
      margin: 18px 0 0 10px;
      border: 2px solid var(--ink);
      height: 50px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .footer {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 0;
      height: 112px;
      border-top: 2px solid var(--ink);
      padding-top: 16px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      border: 2px solid var(--ink);
      height: 58px;
    }

    .nav button {
      border: 0;
      border-right: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-rows: 25px 1fr;
      place-items: center;
      padding: 5px 0 4px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .nav button:last-child { border-right: 0; }
    .nav button.active { background: var(--ink); color: var(--paper); }
    .nav .icon { width: 22px; height: 22px; }

    .icon { display: block; fill: currentColor; pointer-events: none; }
  </style>
</head>

  <main class="screen" aria-label="Lily Remote device controls prototype">
    <section class="frame">
      <header class="topbar">
        <div class="brand"><span>Lily Remote</span><span>Living Room</span></div>
        <div class="pill">Online</div>
        <button class="off" type="button"><svg class="icon"><use href="#mdi-power"></use></svg><span>Off</span></button>
      </header>

      <section class="hero">
        <h1>Remote</h1>
        <div class="target"><span>Target</span><span id="targetName">Telia Box</span></div>
      </section>

      <nav class="device-tabs" aria-label="Remote target">
        <button class="active" data-target="telia" type="button"><svg class="icon"><use href="#mdi-box"></use></svg><span>Telia</span></button>
        <button data-target="wiim" type="button"><svg class="icon"><use href="#mdi-music"></use></svg><span>WiiM</span></button>
        <button data-target="tv" type="button"><svg class="icon"><use href="#mdi-tv"></use></svg><span>TV</span></button>
        <button data-target="kef" type="button"><svg class="icon"><use href="#mdi-speaker"></use></svg><span>LS60</span></button>
      </nav>

      <section id="panel-telia" class="panel active" aria-label="Telia navigation controls">
        <div class="top-actions">
          <button class="key" type="button"><svg class="icon"><use href="#mdi-back"></use></svg><span>Back</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-home"></use></svg><span>Home</span></button>
        </div>
        <div class="dpad">
          <div></div>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-up"></use></svg><small>Up</small></button>
          <div></div>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-left"></use></svg><small>Left</small></button>
          <button class="key ok" type="button"><span class="ring">OK</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-right"></use></svg><small>Right</small></button>
          <div></div>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-down"></use></svg><small>Down</small></button>
          <div></div>
        </div>
      </section>

      <section id="panel-wiim" class="panel" aria-label="WiiM input and volume controls">
        <div class="control-grid">
          <button class="key wide" type="button"><svg class="icon"><use href="#mdi-vol"></use></svg><span>Volume +</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-hdmi"></use></svg><span>HDMI</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-record"></use></svg><span>Phono</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-mute"></use></svg><span>Mute</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-vol"></use></svg><span>Volume -</span></button>
        </div>
      </section>

      <section id="panel-tv" class="panel" aria-label="TV power and input controls">
        <div class="control-grid">
          <button class="key wide" type="button"><svg class="icon"><use href="#mdi-power"></use></svg><span>TV Power</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-box"></use></svg><span>Telia</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-hdmi"></use></svg><span>PS5</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-tv"></use></svg><span>Plex</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-tv"></use></svg><span>Netflix</span></button>
        </div>
        <div class="subtle">TV uses input + power only</div>
      </section>

      <section id="panel-kef" class="panel" aria-label="LS60 recovery controls">
        <div class="control-grid">
          <button class="key wide" type="button"><svg class="icon"><use href="#mdi-speaker"></use></svg><span>Coax · Unity 71</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-hdmi"></use></svg><span>Coax</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-vol"></use></svg><span>Vol 71</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-vol"></use></svg><span>Vol +</span></button>
          <button class="key" type="button"><svg class="icon"><use href="#mdi-vol"></use></svg><span>Vol -</span></button>
        </div>
        <div class="subtle">Recovery only · WiiM is normal volume</div>
      </section>

      <footer class="footer">
        <nav class="nav" aria-label="Pages">
          <button type="button"><svg class="icon"><use href="#mdi-home"></use></svg><span>Home</span></button>
          <button class="active" type="button"><svg class="icon"><use href="#mdi-playpause"></use></svg><span>Media</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-light"></use></svg><span>Lights</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-info"></use></svg><span>Info</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-dots"></use></svg><span>More</span></button>
        </nav>
      </footer>
    </section>
  </main>

  <script>
    const names = { telia: 'Telia Box', wiim: 'WiiM', tv: 'TV', kef: 'LS60' };
    const targetName = document.getElementById('targetName');

    document.querySelectorAll('.device-tabs button').forEach(button => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        document.querySelectorAll('.device-tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(`panel-${target}`).classList.add('active');
        targetName.textContent = names[target];
      });
    });
  </script>
</body>
</html>

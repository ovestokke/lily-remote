<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lily Remote — Media Prototype</title>
  <style>
    :root {
      --ink: #10110f;
      --paper: #e7e8dc;
      --paper-deep: #d8dacb;
      --w: 540px;
      --h: 960px;
      --mono: "Courier Prime", "IBM Plex Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #333 0 1px, transparent 1.5px),
        linear-gradient(135deg, #191919, #050505);
      background-size: 18px 18px, auto;
      color: var(--ink);
      font-family: var(--mono);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 0;
    }

    .screen {
      width: var(--w);
      height: var(--h);
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(16,17,15,.025) 0 1px, transparent 1px 9px),
        linear-gradient(0deg, rgba(16,17,15,.018) 0 1px, transparent 1px 9px),
        var(--paper);
      border: 18px solid var(--ink);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(0,0,0,.26) .6px, transparent .8px);
      background-size: 4px 4px;
      opacity: .08;
      mix-blend-mode: multiply;
    }

    .frame {
      position: absolute;
      inset: 0;
      border: 1px solid var(--ink);
      padding: 0 24px;
    }

    .topbar {
      height: 112px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      border-bottom: 3px solid var(--ink);
      position: relative;
    }

    .page-title {
      margin: 0;
      font-size: 44px;
      line-height: .9;
      letter-spacing: .015em;
    }

    .pill, .media-off {
      height: 38px;
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 0 10px;
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .media-off {
      grid-auto-flow: column;
      gap: 6px;
      background: var(--ink);
      color: var(--paper);
    }

    .media-off .icon { width: 18px; height: 18px; }

    .device-tabs {
      height: 62px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 2px solid var(--ink);
      margin-top: 22px;
    }

    .device-tabs button {
      border: 0;
      border-right: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-rows: 27px 1fr;
      place-items: center;
      padding: 6px 0 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .device-tabs button:last-child { border-right: 0; }
    .device-tabs button.active { background: var(--ink); color: var(--paper); }
    .device-tabs .icon { width: 24px; height: 24px; }

    .device-panel {
      display: none;
      margin-top: 18px;
    }

    .device-panel.active { display: block; }

    .panel-title {
      height: 54px;
      background: var(--ink);
      color: var(--paper);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .panel-title span:last-child {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .key, .source-button, .wide-button, .transport button, .side-button {
      border: 3px solid var(--ink);
      background: var(--paper);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .key:active,
    .source-button:active,
    .wide-button:active,
    .transport button:active,
    .side-button:active,
    .device-tabs button:active,
    .nav button:active,
    .media-off:active { filter: invert(1); }

    .dpad-layout {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 14px;
    }

    .side-stack {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 318px;
    }

    .side-button {
      display: grid;
      place-items: center;
      font-size: 12px;
    }

    .dpad {
      height: 318px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border: 3px solid var(--ink);
      background: var(--paper-deep);
    }

    .dpad button {
      border: 0;
      border-right: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
    }

    .dpad button:nth-child(3n) { border-right: 0; }
    .dpad button:nth-last-child(-n + 3) { border-bottom: 0; }
    .dpad .empty { background: var(--paper-deep); }
    .dpad .ok { background: var(--ink); color: var(--paper); font-size: 22px; font-weight: 800; }
    .dpad .icon { width: 42px; height: 42px; }

    .transport {
      height: 64px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 2px solid var(--ink);
      margin-top: 14px;
    }

    .transport button {
      border: 0;
      border-right: 2px solid var(--ink);
      display: grid;
      place-items: center;
    }

    .transport button:last-child { border-right: 0; }
    .transport .icon { width: 30px; height: 30px; }

    .volume-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .volume-grid button {
      height: 112px;
      display: grid;
      place-items: center;
    }

    .volume-grid .primary {
      background: var(--ink);
      color: var(--paper);
    }

    .volume-grid .icon { width: 42px; height: 42px; }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .source-button {
      height: 92px;
      display: grid;
      grid-template-columns: 48px 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      text-align: left;
      font-size: 17px;
      letter-spacing: .01em;
      text-transform: none;
    }

    .source-button .icon { width: 36px; height: 36px; }

    .source-button small {
      display: block;
      margin-top: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .wide-button {
      height: 106px;
      width: 100%;
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      margin-bottom: 14px;
      text-align: left;
      font-size: 19px;
      letter-spacing: .01em;
      text-transform: none;
    }

    .wide-button.primary {
      background: var(--ink);
      color: var(--paper);
    }

    .wide-button .icon { width: 42px; height: 42px; }
    .wide-button b { font-size: 20px; }
    .wide-button small {
      display: block;
      margin-top: 6px;
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .tv-power {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .tv-power button {
      height: 78px;
      border: 3px solid var(--ink);
      background: var(--paper);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .tv-power .primary {
      background: var(--ink);
      color: var(--paper);
    }

    .recovery-mark {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .footer {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 0;
      height: 112px;
      border-top: 2px solid var(--ink);
      padding-top: 16px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      border: 2px solid var(--ink);
      height: 58px;
    }

    .nav button {
      border: 0;
      border-right: 2px solid var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-rows: 25px 1fr;
      place-items: center;
      padding: 5px 0 4px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .nav button:last-child { border-right: 0; }
    .nav button.active { background: var(--ink); color: var(--paper); }
    .nav .icon { width: 22px; height: 22px; }

    .icon {
      display: block;
      fill: currentColor;
      pointer-events: none;
    }
  </style>
</head>

  <main class="screen" aria-label="Lily Remote Media page prototype">
    <section class="frame">
      <header class="topbar">
        <h1 class="page-title">Media</h1>
        <div class="pill">Online</div>
        <button class="media-off" type="button" aria-label="Turn off media">
          <svg class="icon"><use href="#mdi-power"></use></svg>
          <span>Off</span>
        </button>
      </header>

      <nav class="device-tabs" aria-label="Device controls">
        <button class="active" data-target="telia" type="button"><svg class="icon"><use href="#mdi-set-top-box"></use></svg><span>Telia</span></button>
        <button data-target="wiim" type="button"><svg class="icon"><use href="#mdi-music"></use></svg><span>WiiM</span></button>
        <button data-target="tv" type="button"><svg class="icon"><use href="#mdi-television-classic"></use></svg><span>TV</span></button>
        <button data-target="ls60" type="button"><svg class="icon"><use href="#mdi-speaker"></use></svg><span>LS60</span></button>
      </nav>

      <section id="panel-telia" class="device-panel active" aria-label="Telia controls">
        <div class="panel-title"><span>Telia</span><span>navigation</span></div>
        <div class="dpad-layout">
          <div class="side-stack">
            <button class="side-button" type="button">Back</button>
            <button class="side-button" type="button">Home</button>
          </div>
          <div class="dpad">
            <button class="empty" type="button" aria-hidden="true"></button>
            <button type="button" aria-label="Up"><svg class="icon"><use href="#mdi-arrow-up-bold"></use></svg></button>
            <button class="empty" type="button" aria-hidden="true"></button>
            <button type="button" aria-label="Left"><svg class="icon"><use href="#mdi-arrow-left-bold"></use></svg></button>
            <button class="ok" type="button">OK</button>
            <button type="button" aria-label="Right"><svg class="icon"><use href="#mdi-arrow-right-bold"></use></svg></button>
            <button class="empty" type="button" aria-hidden="true"></button>
            <button type="button" aria-label="Down"><svg class="icon"><use href="#mdi-arrow-down-bold"></use></svg></button>
            <button class="empty" type="button" aria-hidden="true"></button>
          </div>
        </div>
        <div class="transport" aria-label="Telia media keys">
          <button type="button" aria-label="Rewind"><svg class="icon"><use href="#mdi-rewind"></use></svg></button>
          <button type="button" aria-label="Play pause"><svg class="icon"><use href="#mdi-play-pause"></use></svg></button>
          <button type="button" aria-label="Fast forward"><svg class="icon"><use href="#mdi-fast-forward"></use></svg></button>
        </div>
      </section>

      <section id="panel-wiim" class="device-panel" aria-label="WiiM controls">
        <div class="panel-title"><span>WiiM</span><span>preamp</span></div>
        <div class="volume-grid">
          <button class="key" type="button" aria-label="Volume down"><svg class="icon"><use href="#mdi-volume-minus"></use></svg></button>
          <button class="key primary" type="button" aria-label="Mute"><svg class="icon"><use href="#mdi-volume-mute"></use></svg></button>
          <button class="key" type="button" aria-label="Volume up"><svg class="icon"><use href="#mdi-volume-plus"></use></svg></button>
        </div>
        <div class="source-grid">
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-video-input-hdmi"></use></svg><span>HDMI<small>script.remote_wiim_select_hdmi</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-record-player"></use></svg><span>Phono<small>script.remote_wiim_select_phono</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-arrow-u-left-top-bold"></use></svg><span>Aux<small>script.remote_wiim_select_aux</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-wifi"></use></svg><span>Wi-Fi<small>script.remote_wiim_select_wifi</small></span></button>
        </div>
        <div class="transport" aria-label="WiiM media keys">
          <button type="button" aria-label="Previous"><svg class="icon"><use href="#mdi-skip-previous"></use></svg></button>
          <button type="button" aria-label="Play pause"><svg class="icon"><use href="#mdi-play-pause"></use></svg></button>
          <button type="button" aria-label="Next"><svg class="icon"><use href="#mdi-skip-next"></use></svg></button>
        </div>
      </section>

      <section id="panel-tv" class="device-panel" aria-label="TV controls">
        <div class="panel-title"><span>TV</span><span>power + input</span></div>
        <div class="tv-power">
          <button type="button">On</button>
          <button class="primary" type="button">Toggle</button>
          <button type="button">Off</button>
        </div>
        <div class="source-grid">
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-set-top-box"></use></svg><span>Telia<small>Sagemcom Set-Top Box</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-video-input-hdmi"></use></svg><span>PS5<small>PS5 Game Console</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-video-input-hdmi"></use></svg><span>HDMI 4<small>remote_tv_select_source</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-television-classic"></use></svg><span>Live TV<small>remote_tv_select_source</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-play-circle"></use></svg><span>Plex<small>remote_tv_select_source</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-play-circle"></use></svg><span>Netflix<small>remote_tv_select_source</small></span></button>
        </div>
      </section>

      <section id="panel-ls60" class="device-panel" aria-label="LS60 recovery controls">
        <div class="panel-title"><span>LS60</span><span>recovery</span></div>
        <button class="wide-button primary" type="button">
          <svg class="icon"><use href="#mdi-speaker"></use></svg>
          <span><b>Restore unity</b><small>Coaxial + volume 71</small></span>
          <span class="recovery-mark">71</span>
        </button>
        <div class="source-grid">
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-video-input-hdmi"></use></svg><span>Coax<small>select_coaxial</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-volume-plus"></use></svg><span>Vol 71<small>unity gain</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-arrow-u-left-top-bold"></use></svg><span>Analog<small>select_analog</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-video-input-hdmi"></use></svg><span>Optical<small>select_optical</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-television-classic"></use></svg><span>TV<small>select_tv</small></span></button>
          <button class="source-button" type="button"><svg class="icon"><use href="#mdi-bluetooth"></use></svg><span>Bluetooth<small>select_bluetooth</small></span></button>
        </div>
      </section>

      <footer class="footer">
        <nav class="nav" aria-label="Pages">
          <button type="button"><svg class="icon"><use href="#mdi-home"></use></svg><span>Home</span></button>
          <button class="active" type="button"><svg class="icon"><use href="#mdi-play-circle"></use></svg><span>Media</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-lightbulb-on"></use></svg><span>Lights</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-sofa"></use></svg><span>Room</span></button>
          <button type="button"><svg class="icon"><use href="#mdi-dots-horizontal"></use></svg><span>More</span></button>
        </nav>
      </footer>
    </section>
  </main>

  <script>
    document.querySelectorAll('[data-target]').forEach(button => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        document.querySelectorAll('[data-target]').forEach(b => b.classList.toggle('active', b === button));
        document.querySelectorAll('.device-panel').forEach(panel => panel.classList.toggle('active', panel.id === `panel-${target}`));
      });
    });
  </script>
</body>
</html>
